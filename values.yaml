logstash:
  enabled: true
  replicas: 1

  extraEnvs:
    - name: "ELASTICSEARCH_USERNAME"
      valueFrom:
        secretKeyRef:
          name: elasticsearch-master-credentials
          key: username
    - name: "ELASTICSEARCH_PASSWORD"
      valueFrom:
        secretKeyRef:
          name: elasticsearch-master-credentials
          key: password
  # Allows you to add any config files in /usr/share/logstash/config/
  # such as logstash.yml and log4j2.properties
  #
  # Note that when overriding logstash.yml, `http.host: 0.0.0.0` should always be included
  # to make default probes work.
  logstashConfig:
    logstash.yml: |
      http.host: 0.0.0.0
      xpack.monitoring.enabled: false

  #  logstash.yml: |
  #    key:
  #      nestedkey: value
  #  log4j2.properties: |
  #    key = value

  # Allows you to add any pipeline files in /usr/share/logstash/pipeline/
  ### ***warn*** there is a hardcoded logstash.conf in the image, override it first
  logstashPipeline:
    logstash.conf: |
      input {
        beats {
          port => 5044
        }
      }

      output {
        elasticsearch {
          hosts => ["https://elasticsearch-master:9200"]
          cacert => "/usr/share/logstash/config/elasticsearch-master-certs/ca.crt"
          user => '${ELASTICSEARCH_USERNAME}'
          password => '${ELASTICSEARCH_PASSWORD}'
        }
      }
  # Allows you to add any pattern files in your custom pattern dir
  logstashPatternDir: "/usr/share/logstash/patterns/"
  logstashPattern: {}
  #    pattern.conf: |
  #      DPKG_VERSION [-+~<>\.0-9a-zA-Z]+

  # Extra environment variables to append to this nodeGroup
  # This will be appended to the current 'env:' key. You can use any of the kubernetes env
  # syntax here

  # Allows you to load environment variables from kubernetes secret or config map
  envFrom: []
  # - secretRef:
  #     name: env-secret
  # - configMapRef:
  #     name: config-map

  # Add sensitive data to k8s secrets
  secrets: []
  #  - name: "env"
  #    value:
  #      ELASTICSEARCH_PASSWORD: "LS1CRUdJTiBgUFJJVkFURSB"
  #      api_key: ui2CsdUadTiBasRJRkl9tvNnw
  #  - name: "tls"
  #    value:
  #      ca.crt: |
  #        LS0tLS1CRUdJT0K
  #        LS0tLS1CRUdJT0K
  #        LS0tLS1CRUdJT0K
  #        LS0tLS1CRUdJT0K
  #      cert.crt: "LS0tLS1CRUdJTiBlRJRklDQVRFLS0tLS0K"
  #      cert.key.filepath: "secrets.crt" # The path to file should be relative to the `values.yaml` file.

  # A list of secrets and their paths to mount inside the pod
  secretMounts:
    - name: "elasticsearch-master-certs"
      secretName: "elasticsearch-master-certs"
      path: "/usr/share/logstash/config/elasticsearch-master-certs"

  hostAliases: []
  #- ip: "127.0.0.1"
  #  hostnames:
  #  - "foo.local"
  #  - "bar.local"

  image: "docker.elastic.co/logstash/logstash"
  imageTag: "8.5.1"
  imagePullPolicy: "IfNotPresent"
  imagePullSecrets: []

  podAnnotations: {}

  # additionals labels
  labels: {}

  # logstashJavaOpts: "-Xmx1g -Xms1g"
  logstashJavaOpts: "-Xmx512m -Xms512m"

  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  volumeClaimTemplate:
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: 512Mi

  rbac:
    create: false
    serviceAccountAnnotations: {}
    serviceAccountName: ""
    annotations:
      {}
      #annotation1: "value1"
      #annotation2: "value2"
      #annotation3: "value3"

  podSecurityPolicy:
    create: false
    name: ""
    spec:
      privileged: false
      fsGroup:
        rule: RunAsAny
      runAsUser:
        rule: RunAsAny
      seLinux:
        rule: RunAsAny
      supplementalGroups:
        rule: RunAsAny
      volumes:
        - secret
        - configMap
        - persistentVolumeClaim

  persistence:
    enabled: false
    annotations: {}

  extraVolumes:
    []
    # - name: extras
    #   emptyDir: {}

  extraVolumeMounts:
    []
    # - name: extras
    #   mountPath: /usr/share/extras
    #   readOnly: true

  extraContainers:
    []
    # - name: do-something
    #   image: busybox
    #   command: ['do', 'something']

  extraInitContainers:
    []
    # - name: do-something
    #   image: busybox
    #   command: ['do', 'something']

  # This is the PriorityClass settings as defined in
  # https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/#priorityclass
  priorityClassName: ""

  # By default this will make sure two pods don't end up on the same node
  # Changing this to a region would allow you to spread pods across regions
  antiAffinityTopologyKey: "kubernetes.io/hostname"

  # Hard means that by default pods will only be scheduled if there are enough nodes for them
  # and that they will never end up on the same node. Setting this to soft will do this "best effort"
  antiAffinity: "soft"

  # This is the node affinity settings as defined in
  # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity
  nodeAffinity: {}

  # This is inter-pod affinity settings as defined in
  # https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
  podAffinity: {}

  # The default is to deploy all pods serially. By setting this to parallel all pods are started at
  # the same time when bootstrapping the cluster
  podManagementPolicy: "Parallel"

  httpPort: 9600

  # Custom ports to add to logstash
  extraPorts:
    []
    # - name: beats
    #   containerPort: 5001

  updateStrategy: RollingUpdate

  # This is the max unavailable setting for the pod disruption budget
  # The default value of 1 will make sure that kubernetes won't allow more than 1
  # of your pods to be unavailable during maintenance
  maxUnavailable: 1

  podSecurityContext:
    fsGroup: 1000
    runAsUser: 1000

  securityContext:
    capabilities:
      drop:
        - ALL
    # readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

  # How long to wait for logstash to stop gracefully
  terminationGracePeriod: 120

  # Probes
  # Default probes are using `httpGet` which requires that `http.host: 0.0.0.0` is part of
  # `logstash.yml`. If needed probes can be disabled or overridden using the following syntaxes:
  #
  # disable livenessProbe
  # livenessProbe: null
  #
  # replace httpGet default readinessProbe by some exec probe
  # readinessProbe:
  #   httpGet: null
  #   exec:
  #     command:
  #       - curl
  #      - localhost:9600

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 250
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 180
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  ## Use an alternate scheduler.
  ## ref: https://kubernetes.io/docs/tasks/administer-cluster/configure-multiple-schedulers/
  ##
  schedulerName: ""

  nodeSelector: {}
  tolerations: []

  nameOverride: ""
  fullnameOverride: "logstash"

  lifecycle:
    {}
    # preStop:
    #   exec:
    #     command: ["/bin/sh", "-c", "echo Hello from the postStart handler > /usr/share/message"]
    # postStart:
    #   exec:
    #     command: ["/bin/sh", "-c", "echo Hello from the postStart handler > /usr/share/message"]

  pipeline.batch.size: 125
  pipeline.batch.delay: 50
  queue.type: memory

  service:
    annotations: {}
    type: ClusterIP
    loadBalancerIP: ""
    ports:
      - name: beats
        port: 5044
        protocol: TCP
        targetPort: 5044
      - name: http
        port: 8080
        protocol: TCP
        targetPort: 8080
  ingress:
    enabled: false
    annotations:
      {}
      # kubernetes.io/tls-acme: "true"
    className: "nginx"
    pathtype: ImplementationSpecific
    hosts:
      - host: logstash-example.local
        paths:
          - path: /beats
            servicePort: 5044
          - path: /http
            servicePort: 8080
    tls: []
    #  - secretName: logstash-example-tls
    #    hosts:
    #      - logstash-example.local


filebeat:
  enabled: true
  daemonset:
    # Annotations to apply to the daemonset
    annotations: {}
    # additionals labels
    labels: {}
    affinity: {}
    # Include the daemonset
    enabled: true
    # Extra environment variables for Filebeat container.
    envFrom: []
    # - configMapRef:
    #     name: config-secret
    extraEnvs:
      - name: "ELASTICSEARCH_USERNAME"
        valueFrom:
          secretKeyRef:
            name: elasticsearch-master-credentials
            key: username
      - name: "ELASTICSEARCH_PASSWORD"
        valueFrom:
          secretKeyRef:
            name: elasticsearch-master-credentials
            key: password
    # Allows you to add any config files in /usr/share/filebeat
    extraVolumes: []
    # - name: extras
    #   emptyDir: {}
    extraVolumeMounts: []
    # - name: extras
    #   mountPath: /usr/share/extras
    #   readOnly: true
    hostNetworking: false
    # Allows you to add any config files in /usr/share/filebeat
    # such as filebeat.yml for daemonset
    filebeatConfig:
      filebeat.yml: |
        filebeat.autodiscover:
          providers:
            - type: kubernetes
              node: ${NODE_NAME}
              hints.enabled: true
              templates:
                - config:
                    - type: container
                      paths:
                        - /var/log/containers/*.log
        processors:
          - add_kubernetes_metadata: ~
        output.logstash:
          hosts: ["logstash:5044"]
    # Only used when updateStrategy is set to "RollingUpdate"
    maxUnavailable: 1
    nodeSelector: {}
    # A list of secrets and their paths to mount inside the pod
    # This is useful for mounting certificates for security other sensitive values
    secretMounts:
      - name: elasticsearch-master-certs
        secretName: elasticsearch-master-certs
        path: /usr/share/filebeat/certs/
    #  - name: filebeat-certificates
    #    secretName: filebeat-certificates
    #    path: /usr/share/filebeat/certs
    # Various pod security context settings. Bear in mind that many of these have an impact on Filebeat functioning properly.
    #
    # - User that the container will execute as. Typically necessary to run as root (0) in order to properly collect host container logs.
    # - Whether to execute the Filebeat containers as privileged containers. Typically not necessarily unless running within environments such as OpenShift.
    securityContext:
      runAsUser: 0
      privileged: false
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
    tolerations: []

  deployment:
    # Annotations to apply to the deployment
    annotations: {}
    # additionals labels
    labels: {}
    affinity: {}
    # Include the deployment
    enabled: false
    # Extra environment variables for Filebeat container.
    envFrom: []
    # - configMapRef:
    #     name: config-secret
    extraEnvs:
      - name: "ELASTICSEARCH_USERNAME"
        valueFrom:
          secretKeyRef:
            name: elasticsearch-master-credentials
            key: username
      - name: "ELASTICSEARCH_PASSWORD"
        valueFrom:
          secretKeyRef:
            name: elasticsearch-master-credentials
            key: password
    # Allows you to add any config files in /usr/share/filebeat
    extraVolumes: []
    # - name: extras
    #   emptyDir: {}
    extraVolumeMounts: []
    # - name: extras
    #   mountPath: /usr/share/extras
    #   readOnly: true
    # such as filebeat.yml for deployment
    filebeatConfig:
      filebeat.yml: |
        filebeat.inputs:
          - type: log
            paths:
              - /usr/share/filebeat/logs/filebeat
        output.elasticsearch:
          host: "${NODE_NAME}"
          hosts: '["https://${ELASTICSEARCH_HOSTS:elasticsearch-master:9200}"]'
          username: "${ELASTICSEARCH_USERNAME}"
          password: "${ELASTICSEARCH_PASSWORD}"
          protocol: https
          ssl.certificate_authorities: ["/usr/share/filebeat/certs/ca.crt"]
    nodeSelector: {}
    # A list of secrets and their paths to mount inside the pod
    # This is useful for mounting certificates for security other sensitive values
    secretMounts:
      - name: elasticsearch-master-certs
        secretName: elasticsearch-master-certs
        path: /usr/share/filebeat/certs/
    #  - name: filebeat-certificates
    #    secretName: filebeat-certificates
    #    path: /usr/share/filebeat/certs
    #
    # - User that the container will execute as.
    # Not necessary to run as root (0) as the Filebeat Deployment use cases do not need access to Kubernetes Node internals
    # - Typically not necessarily unless running within environments such as OpenShift.
    securityContext:
      runAsUser: 0
      privileged: false
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "384Mi"
    tolerations: []

  # Replicas being used for the filebeat deployment
  replicas: 1

  extraContainers: ""
  # - name: dummy-init
  #   image: busybox
  #   command: ['echo', 'hey']

  extraInitContainers: []
  # - name: dummy-init

  # Root directory where Filebeat will write data to in order to persist registry data across pod restarts (file position and other metadata).
  hostPathRoot: /var/lib

  dnsConfig: {}
  # options:
  #   - name: ndots
  #     value: "2"
  hostAliases: []
  #- ip: "127.0.0.1"
  #  hostnames:
  #  - "foo.local"
  #  - "bar.local"
  image: "docker.elastic.co/beats/filebeat"
  imageTag: "8.5.1"
  imagePullPolicy: "IfNotPresent"
  imagePullSecrets: []

  livenessProbe:
    exec:
      command:
        - sh
        - -c
        - |
          #!/usr/bin/env bash -e
          curl --fail 127.0.0.1:5066
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5

  readinessProbe:
    exec:
      command:
        - sh
        - -c
        - |
          #!/usr/bin/env bash -e
          filebeat test output
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5

  # Whether this chart should self-manage its service account, role, and associated role binding.
  managedServiceAccount: true

  clusterRoleRules:
    - apiGroups:
        - ""
      resources:
        - namespaces
        - nodes
        - pods
      verbs:
        - get
        - list
        - watch
    - apiGroups:
        - "apps"
      resources:
        - replicasets
      verbs:
        - get
        - list
        - watch

  podAnnotations: {}
  # iam.amazonaws.com/role: es-cluster

  # Custom service account override that the pod will use
  serviceAccount: ""

  # Annotations to add to the ServiceAccount that is created if the serviceAccount value isn't set.
  serviceAccountAnnotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/k8s.clustername.namespace.serviceaccount

  # How long to wait for Filebeat pods to stop gracefully
  terminationGracePeriod: 30
  # This is the PriorityClass settings as defined in
  # https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/#priorityclass
  priorityClassName: ""

  updateStrategy: RollingUpdate

  # Override various naming aspects of this chart
  # Only edit these if you know what you're doing
  nameOverride: ""
  fullnameOverride: "filebeat"

